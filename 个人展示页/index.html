<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敬思汶 | 个人主页首页</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei",sans-serif;
        }
        :root{
            --black: #0b0b0b;
            --silver: #c8cdd5;
            --white: #ffffff;
        }
        body{
            background: var(--black);
            color: var(--silver);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        h1{
            font-size: 60px;
            color: var(--white);
            letter-spacing: 4px;
            margin-bottom: 12px;
        }
        .en-title{
            font-size: 16px;
            color: var(--silver);
            letter-spacing: 2px;
            margin-bottom: 60px;
        }
        .btn-box{
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            justify-content: center;
        }
        .btn-box a{
            display: inline-block;
            width: 160px;
            padding: 14px 0;
            border: 1px solid var(--silver);
            color: var(--silver);
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s ease;
            font-size: 15px;
        }
        .btn-box a:hover{
            background: var(--silver);
            color: var(--black);
            transform: translateY(-3px);
        }
        footer{
            position: absolute;
            bottom: 30px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>敬思汶</h1>
    <p class="en-title">软件工程专业 | 数据运营方向</p>

    <div class="btn-box">
        <a href="about.html">关于我</a>
        <a href="skill.html">专业能力</a>
        <a href="experience.html">个人经历</a>
        <a href="contact.html">联系方式</a>
    </div>

    <footer>© 2026 敬思汶 个人网页 版权所有</footer>
</body>
</html>
